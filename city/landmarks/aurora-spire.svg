<svg xmlns="http://www.w3.org/2000/svg" width="260" height="520" viewBox="0 0 260 520">
 <!-- Aurora Spire: tall tapered office spire with a lit crown. Isometric, base at bottom center. -->
 <defs>
  <linearGradient id="spireL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5aa8"/><stop offset="1" stop-color="#3d3f7a"/></linearGradient>
  <linearGradient id="spireR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a9e6"/><stop offset="1" stop-color="#7d7cc0"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a3" stop-opacity=".95"/><stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/></radialGradient>
 </defs>
 <ellipse cx="130" cy="500" rx="92" ry="20" fill="#000" opacity=".12"/>
 <!-- base slab -->
 <polygon points="130,516 36,469 130,422 224,469" fill="#cfd4dc"/>
 <polygon points="36,469 130,516 130,502 36,455" fill="#9aa3b0"/>
 <polygon points="224,469 130,516 130,502 224,455" fill="#b6bdc8"/>
 <!-- lobby block -->
 <polygon points="56,459 130,496 130,446 56,409" fill="#4a4f7e"/>
 <polygon points="204,459 130,496 130,446 204,409" fill="#8c8fc4"/>
 <polygon points="130,446 56,409 130,372 204,409" fill="#e8e9f4"/>
 <g stroke="#ffe9a3" stroke-width="2" opacity=".8">
  <line x1="72" y1="430" x2="72" y2="470"/><line x1="90" y1="439" x2="90" y2="479"/><line x1="108" y1="448" x2="108" y2="488"/>
  <line x1="188" y1="430" x2="188" y2="470"/><line x1="170" y1="439" x2="170" y2="479"/><line x1="152" y1="448" x2="152" y2="488"/>
 </g>
 <!-- tapered shaft -->
 <polygon points="82,422 130,446 130,120 118,96" fill="url(#spireL)"/>
 <polygon points="178,422 130,446 130,120 142,96" fill="url(#spireR)"/>
 <g stroke="#2b2c58" stroke-width="1.3" opacity=".45">
  <line x1="86" y1="392" x2="130" y2="414"/><line x1="90" y1="362" x2="130" y2="382"/><line x1="94" y1="332" x2="130" y2="350"/><line x1="98" y1="302" x2="130" y2="318"/><line x1="102" y1="272" x2="130" y2="286"/><line x1="106" y1="242" x2="130" y2="254"/><line x1="110" y1="212" x2="130" y2="222"/><line x1="114" y1="182" x2="130" y2="190"/><line x1="117" y1="152" x2="130" y2="158"/>
  <line x1="174" y1="392" x2="130" y2="414"/><line x1="170" y1="362" x2="130" y2="382"/><line x1="166" y1="332" x2="130" y2="350"/><line x1="162" y1="302" x2="130" y2="318"/><line x1="158" y1="272" x2="130" y2="286"/><line x1="154" y1="242" x2="130" y2="254"/><line x1="150" y1="212" x2="130" y2="222"/><line x1="146" y1="182" x2="130" y2="190"/><line x1="143" y1="152" x2="130" y2="158"/>
 </g>
 <!-- lit ribbons -->
 <polygon points="100,414 112,420 112,110 100,122" fill="#ffe9a3" opacity=".35"/>
 <polygon points="160,414 148,420 148,110 160,122" fill="#ffffff" opacity=".35"/>
 <!-- crown -->
 <circle cx="130" cy="88" r="46" fill="url(#glow)"/>
 <polygon points="118,96 130,120 142,96 130,60" fill="#f2c14e"/>
 <polygon points="118,96 130,104 130,60" fill="#d9a83a"/>
 <rect x="128" y="12" width="4" height="50" fill="#5b5f8a"/>
 <circle cx="130" cy="10" r="5" fill="#ffe9a3"/>
 <!-- entrance canopy -->
 <polygon points="130,496 104,483 104,475 130,488" fill="#f2c14e"/>
 <polygon points="130,496 156,483 156,475 130,488" fill="#d9a83a"/>
</svg>
